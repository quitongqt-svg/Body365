<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BodyCare 365 - Lịch Tập & Dinh Dưỡng Theo Ngành Nghề</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .neon-border-green { border-color: rgba(34, 197, 94, 0.5); }
    .neon-border-blue { border-color: rgba(56, 189, 248, 0.5); }
    .neon-border-amber { border-color: rgba(251, 191, 36, 0.5); }
    .neon-border-purple { border-color: rgba(192, 132, 252, 0.5); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

  <!-- Header Section -->
  <header class="glass-card sticky top-0 z-50 py-3.5 px-5 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-xl flex items-center justify-center text-slate-950 text-lg font-black shadow-lg shadow-emerald-500/20">
        💪
      </div>
      <div>
        <span class="font-extrabold text-base tracking-tight text-white block leading-none">BodyCare <span class="text-emerald-400">365</span></span>
        <span class="text-[10px] text-slate-400 font-medium">Sức Khỏe & Vận Động Thực Chiến</span>
      </div>
    </div>
    <span class="text-[10px] bg-emerald-500/10 text-emerald-400 font-bold px-2.5 py-1 rounded-full border border-emerald-500/30">
      ⚡ Mộc Mạc & Hiệu Quả
    </span>
  </header>

  <!-- Main Container -->
  <main class="max-w-md w-full mx-auto p-4 space-y-4 flex-grow">

    <!-- Hero Banner -->
    <div class="relative overflow-hidden rounded-2xl p-5 bg-gradient-to-br from-emerald-900/40 via-slate-900 to-slate-950 border border-emerald-500/30 shadow-2xl">
      <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
      <div class="relative z-10 space-y-1">
        <span class="inline-block px-2 py-0.5 text-[10px] font-bold bg-emerald-400 text-slate-950 rounded-md uppercase tracking-wider mb-1">
          Dành Cho Người Bận Rộn
        </span>
        <h1 class="text-lg font-extrabold text-white tracking-tight leading-snug">
          Lịch Tập & Chế Độ Ăn <br/><span class="text-emerald-400">Theo Đúng Ngành Nghề</span>
        </h1>
        <p class="text-xs text-slate-300 leading-relaxed pt-1">
          Bấm chọn công việc và mục tiêu của bạn bên dưới để nhận phác đồ thực chiến rèn luyện thể lực ngay tại nhà.
        </p>
      </div>
    </div>

    <!-- KHU VỰC 1: CHỌN NGÀNH NGHỀ -->
    <div class="glass-card rounded-2xl p-4 shadow-xl space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center space-x-1.5">
          <span class="text-emerald-400">1️⃣</span>
          <span>Công Việc Hiện Tại Của Bạn:</span>
        </label>
      </div>
      
      <div class="grid grid-cols-2 gap-2 text-xs">
        <button onclick="setJob('vphong', '💻 Nhân Viên Văn Phòng')" 
                class="job-btn glass-card p-3 rounded-xl font-semibold text-left text-slate-200 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800/80 transition-all duration-200 active:scale-95">
          <span class="block text-sm mb-1">💻</span>
          <span class="block text-[11px] font-bold text-white">Văn Phòng</span>
          <span class="block text-[9px] text-slate-400 font-normal">Ngồi nhiều, mỏi vai gáy</span>
        </button>

        <button onclick="setJob('xoca', '🔄 Nhân Viên Làm Theo Ca')" 
                class="job-btn glass-card p-3 rounded-xl font-semibold text-left text-slate-200 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800/80 transition-all duration-200 active:scale-95">
          <span class="block text-sm mb-1">🔄</span>
          <span class="block text-[11px] font-bold text-white">Làm Theo Ca</span>
          <span class="block text-[9px] text-slate-400 font-normal">Xoay ca, thiếu ngủ</span>
        </button>

        <button onclick="setJob('banhang', '🛒 Buôn Bán / Kinh Doanh')" 
                class="job-btn glass-card p-3 rounded-xl font-semibold text-left text-slate-200 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800/80 transition-all duration-200 active:scale-95">
          <span class="block text-sm mb-1">🛒</span>
          <span class="block text-[11px] font-bold text-white">Buôn Bán</span>
          <span class="block text-[9px] text-slate-400 font-normal">Đứng lâu, mỏi lưng chân</span>
        </button>

        <button onclick="setJob('sale', '🛵 Nhân Viên Sale / Thị Trường')" 
                class="job-btn glass-card p-3 rounded-xl font-semibold text-left text-slate-200 border border-slate-800 hover:border-emerald-500 hover:bg-slate-800/80 transition-all duration-200 active:scale-95">
          <span class="block text-sm mb-1">🛵</span>
          <span class="block text-[11px] font-bold text-white">NV Sale / Thị Trường</span>
          <span class="block text-[9px] text-slate-400 font-normal">Di chuyển đường xa</span>
        </button>
      </div>
      <div id="selected-job-text" class="text-xs text-emerald-400 font-bold pt-1 hidden bg-emerald-500/10 p-2 rounded-lg border border-emerald-500/20 text-center"></div>
    </div>

    <!-- KHU VỰC 2: CHỌN MỤC TIÊU TẬP LUYỆN (GẮN AFFILIATE THÔNG MINH) -->
    <div class="glass-card rounded-2xl p-4 shadow-xl space-y-3">
      <label class="text-xs font-bold text-slate-200 uppercase tracking-wider flex items-center space-x-1.5">
        <span class="text-emerald-400">2️⃣</span>
        <span>Mục Tiêu Muốn Đạt ĐƯỢC:</span>
      </label>
      
      <div class="grid grid-cols-2 gap-2.5">
        <!-- Tập để khỏe -->
        <button onclick="triggerGoal('Khoe', 'https://s.shopee.vn/30ojYceOxs')" 
                class="glass-card neon-border-green p-3 rounded-xl font-bold text-xs text-left transition-all duration-200 hover:bg-emerald-500/10 active:scale-95 flex items-center space-x-2.5">
           <div class="w-8 h-8 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-base shrink-0">⚡</div>
           <div>
             <div class="font-extrabold text-white text-xs">Tập Để Kh
